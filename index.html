<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>洛雨综合资源站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        loyu: '#7c3aed'
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .card-hover {
                @apply transition-all duration-300 hover:scale-105 hover:shadow-lg;
            }
            .glass {
                @apply bg-white/10 backdrop-blur-md border border-white/20;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">

    <!-- 导航栏 -->
    <header class="sticky top-0 z-50 glass">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa fa-cube text-loyu text-2xl"></i>
                <span class="font-bold text-xl">洛雨资源</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-700">
                    <i class="fa fa-moon-o dark:hidden"></i>
                    <i class="fa fa-sun-o hidden dark:block"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 首页 Banner -->
    <section class="py-16">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-[clamp(2rem,5vw,3.5rem)] font-bold bg-gradient-to-r from-loyu to-pink-500 bg-clip-text text-transparent">
                洛雨综合资源站
            </h1>
            <p class="mt-4 text-lg text-slate-600 dark:text-slate-300 max-w-xl mx-auto">
                收集整理各类开发、工具、学习资源，持续更新
            </p>

            <!-- 搜索框 -->
            <div class="mt-8 max-w-lg mx-auto">
                <div class="relative">
                    <input id="searchInput" type="text" placeholder="搜索资源名称..."
                        class="w-full px-5 py-3 rounded-xl border dark:border-slate-700 bg-white dark:bg-slate-800 outline-none focus:ring-2 focus:ring-loyu">
                    <i class="fa fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </div>
            </div>
        </div>
    </section>

    <!-- 资源分类 -->
    <section class="container mx-auto px-4 pb-16">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6" id="resourceList">
        </div>
    </section>

    <!-- 页脚 -->
    <footer class="py-8 border-t dark:border-slate-800">
        <div class="container mx-auto px-4 text-center text-slate-500 text-sm">
            <p>洛雨综合资源站 · 静态版本 托管于 GitHub Pages</p>
        </div>
    </footer>

    <script>
        // 资源数据，你在这里新增、修改资源
        const resourceData = [
            {
                title: "洛雨音乐搜索器",
                desc: "音乐搜索与解析工具项目",
                tag: "Web",
                link: "https://github.com/xxx/loyu-music"
            },
            {
                title: "安卓 AIDE 示例代码",
                desc: "AIDE Pro 安卓开发示例，悬浮窗 Demo",
                tag: "Android",
                link: "https://github.com/xxx/aide-demo"
            },
            {
                title: "前端 UI 组件库",
                desc: "透明、日夜主题切换 UI 组件",
                tag: "Frontend",
                link: "https://github.com/xxx/ui-kit"
            },
            {
                title: "工具软件合集",
                desc: "实用电脑、手机工具汇总",
                tag: "Tool",
                link: "https://github.com/xxx/tools"
            }
        ];

        // 渲染资源卡片
        function renderResources(list) {
            const container = document.getElementById("resourceList");
            container.innerHTML = "";
            list.forEach(item => {
                container.innerHTML += `
                    <a href="${item.link}" target="_blank"
                        class="card-hover block p-6 rounded-xl bg-white dark:bg-slate-800 shadow">
                        <span class="inline-block px-3 py-1 text-xs rounded-full bg-loyu/20 text-loyu">
                            ${item.tag}
                        </span>
                        <h3 class="mt-3 text-xl font-semibold">${item.title}</h3>
                        <p class="mt-2 text-slate-500 dark:text-slate-400 text-sm">${item.desc}</p>
                        <div class="mt-4 text-loyu flex items-center gap-1 text-sm">
                            前往查看 <i class="fa fa-arrow-right"></i>
                        </div>
                    </a>
                `;
            })
        }

        // 搜索过滤
        document.getElementById("searchInput").oninput = function () {
            const kw = this.value.trim().toLowerCase();
            const filter = resourceData.filter(r =>
                r.title.toLowerCase().includes(kw) ||
                r.desc.toLowerCase().includes(kw) ||
                r.tag.toLowerCase().includes(kw)
            )
            renderResources(filter);
        }

        // 日夜主题
        const toggleBtn = document.getElementById("themeToggle");
        if (localStorage.theme === "dark" || (!localStorage.theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
        }
        toggleBtn.onclick = () => {
            document.documentElement.classList.toggle("dark");
            localStorage.theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
        }

        // 初始化渲染
        renderResources(resourceData);
    </script>
</body>
</html>
